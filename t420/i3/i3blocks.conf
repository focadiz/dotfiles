# i3blocks configuration, replaces i3status.
# https://vivien.github.io/i3blocks
#
# Adapted from the X200/X220 version for FreeBSD: disk/load/memory have no
# /proc or GNU coreutils here, so those three use FreeBSD-native commands
# (memory via a dedicated script since it needs a couple of sysctl calls).

separator=true
separator_block_width=15
markup=none

[wireless]
command=~/.config/i3/scripts/wireless.sh
interval=5

[ethernet]
command=~/.config/i3/scripts/ethernet.sh
interval=5

[battery]
command=~/.config/i3/scripts/battery.sh
interval=30

[disk]
command=df -h / | awk 'NR==2{print $4}'
interval=30

[load]
command=sysctl -n vm.loadavg | awk '{print $2, $3, $4}'
interval=5

[memory]
command=~/.config/i3/scripts/memory.sh
interval=5

[volume]
command=~/.config/i3/scripts/volume-block.sh
interval=30
signal=10

[time]
command=date '+%Y-%m-%d %H:%M:%S'
interval=1

[power]
command=~/.config/i3/scripts/power-block.sh
interval=once
