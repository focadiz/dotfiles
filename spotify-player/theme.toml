# Dracula theme for spotify-player (https://draculatheme.com). Named palette
# colors ("Blue", "Green", ...) resolve to the Dracula colors below.
[[themes]]
name = "dracula"

[themes.palette]
background = "#282a36"
foreground = "#f8f8f2"
black = "#21222c"
red = "#ff5555"
green = "#50fa7b"
yellow = "#f1fa8c"
blue = "#bd93f9"
magenta = "#ff79c6"
cyan = "#8be9fd"
white = "#f8f8f2"
bright_black = "#6272a4"
bright_red = "#ff6e6e"
bright_green = "#69ff94"
bright_yellow = "#ffffa5"
bright_blue = "#d6acff"
bright_magenta = "#ff92df"
bright_cyan = "#a4ffff"
bright_white = "#ffffff"

[themes.component_style]
block_title = { fg = "#bd93f9", modifiers = ["Bold"] }
border = { fg = "#6272a4" }
playback_track = { fg = "#50fa7b", modifiers = ["Bold"] }
playback_artists = { fg = "#8be9fd" }
playback_album = { fg = "#ff79c6" }
playback_metadata = { fg = "#6272a4" }
playback_progress_bar = { fg = "#bd93f9", bg = "#44475a" }
current_playing = { fg = "#50fa7b", modifiers = ["Bold"] }
page_desc = { fg = "#8be9fd", modifiers = ["Bold"] }
playlist_desc = { fg = "#6272a4" }
table_header = { fg = "#bd93f9", modifiers = ["Bold"] }
selection = { fg = "#f8f8f2", bg = "#44475a", modifiers = ["Bold"] }
like = { fg = "#ff5555", modifiers = ["Bold"] }
lyrics_played = { fg = "#6272a4" }
lyrics_playing = { fg = "#50fa7b", modifiers = ["Bold"] }
visualization = { low = "#bd93f9", mid = "#ff79c6", high = "#ff5555" }
