# urxvt renders 24-bit color; tell tmux so hex colors aren't rounded to 256.
set -as terminal-features ',rxvt-unicode*:RGB'

# Dracula colors (https://draculatheme.com)
# background #282a36  current-line #44475a  foreground #f8f8f2  comment #6272a4
# purple #bd93f9  pink #ff79c6  green #50fa7b  yellow #f1fa8c  red #ff5555

set -g status-style 'bg=#44475a,fg=#f8f8f2'
# Session name in green; turns yellow while the prefix key is pressed.
set -g status-left '#{?client_prefix,#[bg=#f1fa8c],#[bg=#50fa7b]}#[fg=#282a36,bold] #S #[default] '
set -g status-left-length 30
set -g status-right '#[fg=#282a36,bg=#bd93f9] %Y-%m-%d %H:%M '

setw -g window-status-format ' #I #W#F '
setw -g window-status-current-format ' #I #W#F '
setw -g window-status-style 'fg=#f8f8f2,bg=#44475a'
setw -g window-status-current-style 'fg=#f8f8f2,bg=#6272a4,bold'
setw -g window-status-activity-style 'fg=#ff79c6,bg=#44475a'
setw -g window-status-bell-style 'fg=#282a36,bg=#ff5555'
setw -g window-status-separator ''

set -g pane-border-style 'fg=#6272a4'
set -g pane-active-border-style 'fg=#bd93f9'
set -g display-panes-colour '#6272a4'
set -g display-panes-active-colour '#bd93f9'

set -g message-style 'bg=#44475a,fg=#f8f8f2'
set -g message-command-style 'bg=#44475a,fg=#f8f8f2'
setw -g mode-style 'bg=#bd93f9,fg=#282a36'
setw -g clock-mode-colour '#bd93f9'
