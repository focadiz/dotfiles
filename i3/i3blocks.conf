# i3blocks configuration, replaces i3status.
# https://vivien.github.io/i3blocks

separator=true
separator_block_width=15
markup=none

[wireless]
command=~/.config/i3/scripts/wireless.sh
interval=5

[ethernet]
command=~/.config/i3/scripts/ethernet.sh
interval=5

[battery]
command=~/.config/i3/scripts/battery.sh
interval=30

[disk]
command=df -h --output=avail / | tail -1 | tr -d ' '
interval=30

[load]
command=awk '{print $1, $2, $3}' /proc/loadavg
interval=5

[memory]
command=free -h | awk '/^Mem:/{print $3"/"$2}'
interval=5

[time]
command=date '+%Y-%m-%d %H:%M:%S'
interval=1

[power]
command=~/.config/i3/scripts/power-block.sh
interval=once
