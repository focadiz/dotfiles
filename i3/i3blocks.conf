# i3blocks configuration, replaces i3status.
# https://vivien.github.io/i3blocks
#
# [power] is listed first (leftmost) on purpose: i3bar clips overflow
# from the right, so keeping the always-relevant control leftmost
# means it can't get pushed off-screen by a long block elsewhere.

separator=true
separator_block_width=15
markup=none

[power]
command=~/.config/i3/scripts/power-block.sh
interval=once

[wireless]
command=~/.config/i3/scripts/wireless.sh
interval=5

[ethernet]
command=~/.config/i3/scripts/ethernet.sh
interval=5

[battery]
command=~/.config/i3/scripts/battery.sh
interval=30

[disk]
command=df -h --output=avail / | tail -1 | tr -d ' '
interval=30

[load]
command=awk '{print $1, $2, $3}' /proc/loadavg
interval=5

[memory]
command=free -h | awk '/^Mem:/{print $3"/"$2}'
interval=5

[volume]
command=~/.config/i3/scripts/volume-block.sh
interval=30
signal=10

[time]
command=date '+%Y-%m-%d %H:%M:%S'
interval=1
